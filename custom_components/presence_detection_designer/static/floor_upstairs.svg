    <style>
      .fp-bg { fill: none; }
      .fp-room { fill: #1e293b; stroke: #475569; stroke-width: 1.5; transition: fill 0.35s ease, opacity 0.2s ease; cursor: pointer; }
      .fp-room:hover { filter: brightness(1.12); }
      .fp-room-estimated { stroke-dasharray: 5 3; }
      .fp-wall { stroke: #e2e8f0; stroke-width: 3.5; stroke-linecap: round; fill: none; pointer-events: none; }
      .fp-door-leaf { stroke: #e2e8f0; stroke-width: 2; stroke-linecap: round; fill: none; pointer-events: none; }
      .fp-door-arc { stroke: #e2e8f0; stroke-width: 1.2; stroke-dasharray: 3 2; stroke-opacity: 0.65; fill: none; pointer-events: none; }
      .fp-bifold { stroke: #e2e8f0; stroke-width: 1.8; stroke-linecap: round; stroke-opacity: 0.85; fill: none; pointer-events: none; }
      .fp-stairs { stroke: #e2e8f0; stroke-width: 1.3; stroke-opacity: 0.55; fill: none; pointer-events: none; }
      .fp-fixture { stroke: #e2e8f0; stroke-width: 1.4; stroke-opacity: 0.48; fill: none; pointer-events: none; }
      .fp-label { fill: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; text-anchor: middle; pointer-events: none; paint-order: stroke; stroke: #0f172a; stroke-width: 3px; stroke-linejoin: round; }
      .fp-temp { fill: #ffffff; font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; text-anchor: middle; pointer-events: none; paint-order: stroke; stroke: #0f172a; stroke-width: 3.5px; stroke-linejoin: round; }
      .fp-temp-estimated { font-style: italic; opacity: 0.92; }
      .fp-title { fill: #f8fafc; font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; }
      .fp-subtitle { fill: #94a3b8; font-family: system-ui, -apple-system, sans-serif; font-size: 11px; }
    </style>
