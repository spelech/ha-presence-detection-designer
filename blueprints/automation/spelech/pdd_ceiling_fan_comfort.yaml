blueprint:
  name: "PDD — Presence-Driven Ceiling Fan & Thermal Comfort"
  description: >
    Integrates with Presence Detection Designer (`binary_sensor.<room>_presence`) to
    automate ceiling fans and room air circulation based on sustained human occupancy
    and optional room temperature thresholds. Automatically ignores pet-only presence
    (`occupant_type != 'pet'`, `human_present == true`), respects manual/voice turn-off
    suppression (`manual_off_suppressed`), and applies configurable hold delays for
    both activation and room vacation.
  domain: automation
  author: Steven T. Pelech
  input:
    presence_sensor:
      name: PDD Room Presence Binary Sensor
      description: The `binary_sensor.<room>_presence` entity exposed by Presence Detection Designer.
      selector:
        entity:
          domain: binary_sensor
          device_class: occupancy
    fan_target:
      name: Ceiling Fan or Fan Switch Target
      description: The `fan` or `switch` entity controlling the room ceiling fan.
      selector:
        target:
          entity:
            domain:
              - fan
              - switch
    temperature_sensor:
      name: Room Temperature Sensor (Optional)
      description: Optional temperature sensor used to gate automatic fan activation.
      default: ""
      selector:
        entity:
          domain: sensor
          device_class: temperature
    min_temp_threshold:
      name: Minimum Temperature Threshold
      description: Minimum room temperature required before turning the ceiling fan on automatically.
      default: 72
      selector:
        number:
          min: 55
          max: 95
          step: 0.5
          unit_of_measurement: "°F"
    fan_percentage:
      name: Target Fan Speed (%)
      description: Speed percentage for variable-speed `fan` entities (ignored for simple on/off switches).
      default: 50
      selector:
        number:
          min: 10
          max: 100
          step: 5
          unit_of_measurement: "%"
    sustained_presence_seconds:
      name: Sustained Presence Delay (Seconds)
      description: Continuous human occupancy duration required before turning the ceiling fan on.
      default: 120
      selector:
        number:
          min: 0
          max: 900
          unit_of_measurement: "s"
    vacant_hold_seconds:
      name: Vacant Hold Delay (Seconds)
      description: Grace period after the room becomes vacant before turning the ceiling fan off.
      default: 60
      selector:
        number:
          min: 0
          max: 1800
          unit_of_measurement: "s"
    ignore_pets:
      name: Ignore Pet-Only Presence
      description: Skip fan activation when PDD classifies room occupancy as pet-only (`occupant_type == 'pet'` or `human_present == false`).
      default: true
      selector:
        boolean: {}
    respect_manual_off:
      name: Respect Manual & Voice Turn-Off Suppression
      description: Skip automatic fan activation if `manual_off_suppressed` is active on the PDD room presence entity.
      default: true
      selector:
        boolean: {}
    turn_off_on_vacant:
      name: Turn Off Fan When Vacated
      description: Automatically turn off the ceiling fan after `vacant_hold_seconds` when the room is vacated.
      default: true
      selector:
        boolean: {}

mode: restart
max_exceeded: silent

variables:
  presence_sensor: !input presence_sensor
  fan_target: !input fan_target
  temperature_sensor: !input temperature_sensor
  min_temp_threshold: !input min_temp_threshold
  fan_percentage: !input fan_percentage
  sustained_presence_seconds: !input sustained_presence_seconds
  vacant_hold_seconds: !input vacant_hold_seconds
  ignore_pets: !input ignore_pets
  respect_manual_off: !input respect_manual_off
  turn_off_on_vacant: !input turn_off_on_vacant

trigger:
  - platform: state
    entity_id: !input presence_sensor
    to: "on"
    for:
      seconds: !input sustained_presence_seconds
    id: sustained_occupied
  - platform: numeric_state
    entity_id: !input temperature_sensor
    above: !input min_temp_threshold
    id: temp_rose_above_threshold
  - platform: state
    entity_id: !input presence_sensor
    to: "off"
    for:
      seconds: !input vacant_hold_seconds
    id: vacated_hold_expired

action:
  - choose:
      - conditions:
          - condition: trigger
            id:
              - sustained_occupied
              - temp_rose_above_threshold
          - condition: state
            entity_id: !input presence_sensor
            state: "on"
          - condition: template
            value_template: >-
              {{ not respect_manual_off or not (state_attr(presence_sensor, 'manual_off_suppressed') | default(false, true)) }}
          - condition: template
            value_template: >-
              {{ not ignore_pets or (state_attr(presence_sensor, 'occupant_type') != 'pet' and (state_attr(presence_sensor, 'human_present') | default(true, true)) != false) }}
          - condition: template
            value_template: >-
              {{ temperature_sensor == '' or states(temperature_sensor) in ['unknown', 'unavailable'] or (states(temperature_sensor) | float(0) >= (min_temp_threshold | float(72))) }}
        sequence:
          - service: homeassistant.turn_on
            target: !input fan_target
      - conditions:
          - condition: trigger
            id: vacated_hold_expired
          - condition: template
            value_template: "{{ turn_off_on_vacant }}"
          - condition: state
            entity_id: !input presence_sensor
            state: "off"
        sequence:
          - service: homeassistant.turn_off
            target: !input fan_target
