[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ha-presence-detection-designer"
version = "1.0.0"
description = "Home Assistant custom integration combining Wasp-in-a-Box presence, entity condition matrices, and VLM/LLM snapshot verification."
authors = [{name = "Steven T. Pelech"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "homeassistant>=2024.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["custom_components/presence_detection_designer"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
