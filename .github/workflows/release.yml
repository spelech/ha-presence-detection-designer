name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build HACS zip archive
        run: |
          cd custom_components
          zip -r ../presence_detection_designer.zip presence_detection_designer
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: presence_detection_designer.zip
          generate_release_notes: true
          draft: false
          prerelease: false
